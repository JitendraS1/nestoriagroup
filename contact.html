    <!--Email message script start-->
    <script>
document.getElementById("contact-form").addEventListener("submit", function (e) {
    e.preventDefault(); // Stop form from submitting normally

    const form = e.target;
    const formData = new FormData(form);

    showToast("Info", "Sending message...", "bg-info text-white");

    fetch("send-mail.php", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showToast("Success", "✅ Message sent successfully!", "bg-success text-white");
            form.reset();
        } else {
            showToast("Error", "❌ " + data.error, "bg-danger text-white");
        }
    })
    .catch(error => {
        console.error("AJAX error:", error);
        showToast("Error", "❌ Error sending message.", "bg-danger text-white");
    });
});

// Function to show Bootstrap Toast
function showToast(title, body, headerClass) {
    const toastEl = document.getElementById("form-toast");
    const toastTitle = document.getElementById("toast-title");
    const toastBody = document.getElementById("toast-body");

    toastTitle.textContent = title;
    toastBody.textContent = body;

    // Reset header classes and apply new
    toastEl.querySelector(".toast-header").className = "toast-header " + headerClass;

    const bsToast = new bootstrap.Toast(toastEl, { delay: 3000 });
    bsToast.show();
}
</script>
